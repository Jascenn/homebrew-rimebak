name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Homebrew formula
        run: ruby -c Formula/rimebak.rb

      - name: Check whitespace
        run: git diff --check
